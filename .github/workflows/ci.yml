name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify locked runtime state
        run: pnpm doctor

      - name: Validate installable skill
        run: pnpm check:skill

      - name: Smoke test the public installer
        run: |
          export CODEX_HOME="$RUNNER_TEMP/delta-coinbase-guard-codex-home"
          ./install
          "$CODEX_HOME/skills/delta-coinbase-guard/scripts/run" doctor

      - name: Check local documentation links
        run: pnpm check:links

      - name: Validate checked-in Mastra partner artifacts
        run: pnpm check:mastra

  mastra-reference:
    name: Mastra 1.53 reference
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install pinned Mastra reference
        working-directory: examples/mastra
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check and run REVIEW suspend/resume
        working-directory: examples/mastra
        run: pnpm run validate
