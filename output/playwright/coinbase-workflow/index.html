<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>delta x Coinbase - simulated workflow</title>
  <style>
    :root {
      --ink: #18231f;
      --muted: #64716b;
      --paper: #f5f2ea;
      --card: #fffdf8;
      --line: #dcd9cf;
      --delta: #ff5b35;
      --coinbase: #0052ff;
      --green: #146b47;
      --green-bg: #e9f5ee;
      --blue-bg: #edf2ff;
      --amber: #9a6200;
      --amber-bg: #fff5dc;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 92% 4%, rgba(0, 82, 255, 0.09), transparent 29%),
        radial-gradient(circle at 2% 98%, rgba(255, 91, 53, 0.08), transparent 30%);
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 760px;
      padding: 34px 54px 30px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 22px;
    }

    header,
    .title-row,
    main,
    footer { position: relative; z-index: 1; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 850;
      letter-spacing: -0.03em;
      font-size: 21px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      color: white;
      background: var(--delta);
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 8px 24px rgba(255, 91, 53, 0.22);
    }

    .times { color: #8f9994; font-weight: 500; }
    .coinbase { color: var(--coinbase); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #f1c990;
      border-radius: 999px;
      color: #754b00;
      background: var(--amber-bg);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #dd9100;
      box-shadow: 0 0 0 4px rgba(221, 145, 0, 0.13);
    }

    .title-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 24px;
      align-items: end;
    }

    .step-number {
      color: var(--delta);
      font-size: 86px;
      line-height: 0.82;
      font-weight: 900;
      letter-spacing: -0.08em;
    }

    .kicker {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 1000px;
      font-size: 46px;
      line-height: 1.01;
      letter-spacing: -0.045em;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(300px, 0.7fr);
      gap: 20px;
      min-height: 0;
    }

    .panel {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 253, 248, 0.92);
      box-shadow: 0 16px 50px rgba(32, 47, 41, 0.06);
    }

    .panel h2 {
      margin: 0 0 15px;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .panel p { margin: 0; color: var(--muted); line-height: 1.55; }

    .quote {
      display: flex;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    blockquote {
      margin: 0;
      max-width: 960px;
      font-size: 31px;
      line-height: 1.26;
      letter-spacing: -0.035em;
      font-weight: 720;
    }

    .quote-meta,
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .quote-meta {
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .checks {
      display: grid;
      gap: 11px;
      align-content: start;
    }

    .check {
      display: grid;
      grid-template-columns: 25px 1fr;
      gap: 10px;
      align-items: start;
      padding: 13px;
      border-radius: 12px;
      background: #f3f5f2;
    }

    .check .icon {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      color: white;
      background: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .check b { display: block; margin-bottom: 2px; font-size: 13px; }
    .check span { color: var(--muted); font-size: 12px; line-height: 1.35; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric,
    .json-card,
    .decision {
      min-width: 0;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fbfaf6;
    }

    .metric .label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: 19px;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .wide { grid-column: 1 / -1; }

    .json-card {
      height: 100%;
      overflow: hidden;
      color: #dfe9ff;
      background: #14211c;
      border-color: #14211c;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .decision {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 155px;
      text-align: center;
      border-color: #aed3be;
      background: var(--green-bg);
    }

    .decision strong {
      color: var(--green);
      font-size: 52px;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .decision span {
      margin-top: 7px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .callout {
      padding: 15px 16px;
      border-left: 4px solid var(--coinbase);
      border-radius: 0 12px 12px 0;
      background: var(--blue-bg);
      color: #24407d;
      font-size: 13px;
      line-height: 1.45;
    }

    .callout b { color: #16316d; }

    .progress {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .progress-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 7px;
      align-items: center;
      min-width: 0;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #7b8781;
      background: rgba(255, 253, 248, 0.74);
      font-size: 10px;
      font-weight: 760;
    }

    .progress-item .dot {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 7px;
      background: #e8e9e5;
      font-size: 10px;
    }

    .progress-item span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-item.done .dot {
      color: white;
      background: var(--green);
    }

    .progress-item.current {
      color: var(--ink);
      border-color: #f3a791;
      background: #fff5f1;
    }

    .progress-item.current .dot {
      color: white;
      background: var(--delta);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    .footer-row .mono {
      max-width: 590px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .error {
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      padding: 40px;
      color: #8b271f;
      background: #fff1ef;
      font: 700 20px/1.5 ui-sans-serif, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const stepNames = [
      "Intent",
      "Policy",
      "Confirm",
      "Propose",
      "Preview",
      "Authorize",
      "Execute"
    ];

    const titles = [
      "Start with an explicit human instruction.",
      "Compile intent into a closed policy.",
      "Bind authorization to one portfolio.",
      "Propose one deterministic action.",
      "Preview the exact Coinbase economics.",
      "Authorize the exact Create bytes.",
      "Submit once, then reconcile the outcome."
    ];

    const esc = (value) => String(value ?? "—")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const short = (value, length = 18) => {
      const text = String(value ?? "—");
      return text.length <= length ? text : `${text.slice(0, length)}…`;
    };

    const metric = (label, value, detail = "") => `
      <div class="metric">
        <span class="label">${esc(label)}</span>
        <strong>${esc(value)}</strong>
        ${detail ? `<small>${esc(detail)}</small>` : ""}
      </div>`;

    const check = (title, detail) => `
      <div class="check">
        <span class="icon">✓</span>
        <div><b>${esc(title)}</b><span>${esc(detail)}</span></div>
      </div>`;

    const progress = (step) => stepNames.map((name, index) => {
      const n = index + 1;
      const state = n < step ? "done" : n === step ? "current" : "";
      const symbol = n < step ? "✓" : n;
      return `<div class="progress-item ${state}">
        <span class="dot">${symbol}</span><span>${esc(name)}</span>
      </div>`;
    }).join("");

    const policyJson = (policy) => JSON.stringify({
      venue: policy.venue,
      product_id: policy.product_id,
      side: policy.side,
      order_type: policy.order_type,
      size: policy.size,
      limits: policy.limits,
      validity: policy.validity,
      usage: policy.usage
    }, null, 2);

    function content(step, record, intent) {
      const policy = record.policy;
      const action = record.proposal.action;
      const market = record.market;
      const preview = record.preview.evidence;
      const delta = record.delta;
      const execution = record.execution;
      const reconciliation = record.reconciliation;

      if (step === 1) {
        return `
          <section class="panel quote">
            <blockquote>“${esc(intent.trim())}”</blockquote>
            <div class="quote-meta">SOURCE INTENT DIGEST · ${esc(record.source_intent_digest)}</div>
          </section>
          <aside class="panel checks">
            <h2>Why this is executable</h2>
            ${check("Exact venue and pair", "Coinbase Advanced · ETH-USDC")}
            ${check("Exact economic ceiling", "5 USDC principal · 5.50 USDC all-in")}
            ${check("Exact order semantics", "BUY · price-bounded SOR limit IOC")}
            ${check("Explicit validity", "One use · 120-second authorization")}
          </aside>`;
      }

      if (step === 2) {
        return `
          <section class="panel"><div class="json-card">${esc(policyJson(policy))}</div></section>
          <aside class="panel">
            <h2>Closed policy output</h2>
            <div class="grid">
              ${metric("Product", policy.product_id)}
              ${metric("Side", policy.side)}
              ${metric("Exact size", `${policy.size.value} ${policy.size.asset}`)}
              ${metric("Order", policy.order_type)}
              ${metric("Slippage", `${policy.limits.max_slippage_bps} bps max`)}
              ${metric("All-in", `${policy.limits.max_all_in_debit.value} ${policy.quote_asset}`)}
            </div>
            <div class="callout" style="margin-top:14px"><b>Compiler authority: none.</b> The parser can produce this draft, but it cannot approve execution.</div>
          </aside>`;
      }

      if (step === 3) {
        return `
          <section class="panel">
            <h2>Two independent human confirmations</h2>
            <div class="grid">
              ${metric("Policy digest", short(record.policy_digest, 28), "MATCHED")}
              ${metric("Execution digest", short(record.confirmation.execution_digest, 28), "MATCHED")}
              ${metric("Portfolio", short(record.credential_binding.portfolio_fingerprint, 28), "Bound before execution")}
              ${metric("Credential", short(record.credential_binding.credential_fingerprint, 28), "View + Trade only")}
              ${metric("Confirmed", record.confirmation.confirmed_at, "TTL starts here")}
              ${metric("Expires", record.confirmation.policy_expires_at, "No extension for setup time")}
            </div>
          </section>
          <aside class="panel checks">
            <h2>Credential guardrails</h2>
            ${check("Can view", "Required")}
            ${check("Can trade", "Required")}
            ${check("Cannot transfer", "Enforced")}
            ${check("Cannot receive", "Enforced")}
            <div class="callout"><b>Simulation binding.</b> These are synthetic fingerprints; no Coinbase credential was read.</div>
          </aside>`;
      }

      if (step === 4) {
        return `
          <section class="panel">
            <h2>Fresh market evidence</h2>
            <div class="grid">
              ${metric("Best bid", market.best_bid, market.product_id)}
              ${metric("Best ask", market.best_ask, market.product_id)}
              ${metric("Observed", market.observed_at, "Maximum age: 5 seconds")}
              ${metric("Price increment", market.price_increment)}
              ${metric("Product", market.product_id, market.product_type)}
              ${metric("Flags", "Executable", "No cancel-only, post-only, or auction mode")}
            </div>
          </section>
          <aside class="panel">
            <h2>Deterministic agent proposal</h2>
            <div class="grid">
              ${metric("Side", action.side)}
              ${metric("Quote size", `${action.quote_size} USDC`)}
              ${metric("Limit price", action.limit_price)}
              ${metric("Time in force", action.time_in_force)}
              ${metric("Proposal check", record.proposal_check.verdict, "All constraints pass")}
              ${metric("Expires", record.proposal.expires_at)}
            </div>
            <div class="callout" style="margin-top:14px"><b>No free-form trade generation.</b> The proposer only fills the already-authorized degrees of freedom.</div>
          </aside>`;
      }

      if (step === 5) {
        return `
          <section class="panel">
            <h2>Coinbase Preview response</h2>
            <div class="grid">
              ${metric("Preview ID", short(preview.preview_id, 25))}
              ${metric("Quote size", `${preview.quote_size} USDC`)}
              ${metric("Estimated fill", preview.est_average_filled_price)}
              ${metric("Best ask", preview.best_ask)}
              ${metric("Commission", `${preview.commission_total} USDC`)}
              ${metric("Order total", `${preview.order_total} USDC`)}
              ${metric("Errors", preview.errs.length, "Must be zero")}
              ${metric("Warnings", preview.warning.length, "Must be zero")}
            </div>
          </section>
          <aside class="panel checks">
            <h2>Local preview gate</h2>
            ${check("Pair, side, and type", "Match the confirmed policy")}
            ${check("Principal", "No size drift")}
            ${check("Commission", "Within 0.50 USDC")}
            ${check("All-in debit", "Within 5.50 USDC")}
            ${check("Estimated fill", "Within price and slippage limits")}
            <div class="decision"><strong>${esc(record.preview_check.verdict)}</strong><span>Create still not called</span></div>
          </aside>`;
      }

      if (step === 6) {
        return `
          <section class="panel">
            <h2>Signed delta decision</h2>
            <div class="grid">
              ${metric("Decision", delta.decision)}
              ${metric("Signature", delta.signature_verified ? "VERIFIED" : "FAILED")}
              ${metric("Decision ID", short(delta.decision_id, 24))}
              ${metric("One-time grant", short(delta.one_time_grant_digest, 24))}
              ${metric("Evaluated", delta.evaluated_at)}
              ${metric("Expires", delta.expires_at)}
              ${metric("Create bytes", short(delta.bindings.create_payload_digest, 28), "SHA-256")}
              ${metric("Client order ID", short(delta.bindings.client_order_id, 24))}
            </div>
          </section>
          <aside class="panel">
            <div class="decision"><strong>${esc(delta.decision)}</strong><span>Ed25519 signature verified</span></div>
            <div class="checks" style="margin-top:14px">
              ${check("Intent and policy bound", "Plan, policy, execution, and validity digests")}
              ${check("Evidence bound", "Market, preview, and preview ID")}
              ${check("Execution bound", "Exact UTF-8 Create bytes and client order ID")}
              ${check("Credential bound", "Key and portfolio fingerprints")}
            </div>
          </aside>`;
      }

      return `
        <section class="panel">
          <h2>Simulated Coinbase outcome</h2>
          <div class="grid">
            ${metric("Status", record.status)}
            ${metric("Order ID", short(execution.order_id, 25))}
            ${metric("Filled principal", `${reconciliation.order.filled_value} USDC`)}
            ${metric("Fees", `${reconciliation.order.total_fees} USDC`)}
            ${metric("All-in debit", `${reconciliation.checks.actual_all_in_debit} USDC`)}
            ${metric("Average fill", reconciliation.order.average_filled_price)}
            ${metric("Fills complete", reconciliation.fills_complete ? "YES" : "NO")}
            ${metric("Evidence coherent", reconciliation.evidence_coherent ? "YES" : "NO")}
          </div>
        </section>
        <aside class="panel">
          <div class="decision"><strong>${esc(record.status)}</strong><span>Post-trade checks pass</span></div>
          <div class="checks" style="margin-top:14px">
            ${check("Submitted once", "Plan and delta JTI consumed before Create")}
            ${check("Exact response binding", "Order, client ID, product, side, and IOC config")}
            ${check("Actual economics checked", "Principal, fees, all-in, average, fills")}
            ${check("Recovery available", "Read-only client_order_id lookup; never retries Create")}
          </div>
          <div class="callout" style="margin-top:14px"><b>Simulation only.</b> Coinbase and the production delta evaluator were not contacted; no funds moved.</div>
        </aside>`;
    }

    async function render() {
      const params = new URLSearchParams(location.search);
      const step = Math.min(7, Math.max(1, Number(params.get("step") || 1)));
      const [recordResponse, intentResponse] = await Promise.all([
        fetch("/artifacts/execution-readiness.json", { cache: "no-store" }),
        fetch("/examples/first-live-intent.txt", { cache: "no-store" })
      ]);
      if (!recordResponse.ok || !intentResponse.ok) {
        throw new Error("Could not load the simulated execution record.");
      }
      const record = await recordResponse.json();
      const intent = await intentResponse.text();
      document.title = `Step ${step} - ${stepNames[step - 1]} - delta x Coinbase`;
      document.getElementById("app").innerHTML = `
        <div class="page">
          <header>
            <div class="brand"><span class="mark">δ</span><span>delta</span><span class="times">×</span><span class="coinbase">Coinbase</span></div>
            <div class="badge">SIMULATED · NO REAL ORDER</div>
          </header>
          <section class="title-row">
            <div class="step-number">0${step}</div>
            <div><div class="kicker">Mandate-gated execution workflow</div><h1>${esc(titles[step - 1])}</h1></div>
          </section>
          <main>${content(step, record, intent)}</main>
          <footer>
            <div class="progress">${progress(step)}</div>
            <div class="footer-row">
              <span>Generated from the checked-in simulated execution record · ${esc(record.generated_at)}</span>
              <span class="mono">Record ${esc(record.record_digest)}</span>
            </div>
          </footer>
        </div>`;
    }

    render().catch((error) => {
      document.getElementById("app").innerHTML = `<div class="error">${esc(error.message)}</div>`;
    });
  </script>
</body>
</html>
